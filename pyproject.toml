[project]
name = "macademia-assistant"
version = "0.1.0"
description = "Ассистент для родителей: ETL и ядро диалога"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-httplib2>=0.1",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]